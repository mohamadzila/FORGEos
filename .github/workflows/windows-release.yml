name: ForgeOS Windows Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare native source
        shell: pwsh
        run: |
          $p = "win-native/ForgeOS.cpp"
          $s = Get-Content $p -Raw
          $s = $s.Replace("disk=forge::widen(argv[++i]);","disk=std::filesystem::path(argv[++i]);")
          if ($s -notmatch 'static forge::Desktop\* g=') { throw "Native source marker missing" }
          $s = [regex]::Replace($s, '(\r?\n)(static forge::Desktop\* g=)', '$1}$1$2', 1)
          Set-Content $p -Value $s -Encoding utf8

      - name: Configure MSVC Release
        shell: pwsh
        run: cmake -S win-native -B win-native/build -G "Visual Studio 17 2022" -A x64

      - name: Build native PE
        shell: pwsh
        run: cmake --build win-native/build --config Release --parallel

      - name: Verify PE x64
        shell: pwsh
        run: |
          $p = "win-native/build/Release/ironbox.exe"
          if (-not (Test-Path $p)) { throw "ironbox.exe was not produced" }
          $b = [IO.File]::ReadAllBytes($p)
          if ($b.Length -lt 64 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "Not a PE/MZ executable" }
          $pe = [BitConverter]::ToInt32($b,0x3C)
          if ($pe -lt 0 -or $pe + 6 -gt $b.Length) { throw "Invalid PE header" }
          if ($b[$pe] -ne 0x50 -or $b[$pe+1] -ne 0x45 -or $b[$pe+2] -ne 0 -or $b[$pe+3] -ne 0) { throw "Invalid PE signature" }
          $machine = [BitConverter]::ToUInt16($b,$pe+4)
          if ($machine -ne 0x8664) { throw "Expected x64 PE, got 0x$('{0:X4}' -f $machine)" }

      - name: Native self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          & ".\win-native\build\Release\ironbox.exe" --headless --disk "$pwd\package\forgeos.forgefs"
          if ($LASTEXITCODE -ne 0) { throw "ForgeOS self-test failed with $LASTEXITCODE" }

      - name: Boot smoke test
        shell: pwsh
        run: |
          & ".\win-native\build\Release\ironbox.exe" --headless --disk "$pwd\package\forgeos.forgefs"
          if ($LASTEXITCODE -ne 0) { throw "Boot smoke test failed with $LASTEXITCODE" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/bin | Out-Null
          Copy-Item "win-native/build/Release/ironbox.exe" "package/bin/ironbox.exe"
          if (Test-Path "package/forgeos.forgefs") { Copy-Item "package/forgeos.forgefs" "package/bin/forgeos.forgefs" -Force }
          if (Test-Path "package/forgeos.forgefs.snapshot") { Copy-Item "package/forgeos.forgefs.snapshot" "package/bin/forgeos.forgefs.snapshot" -Force }
          Copy-Item "win-native/ForgeOS.cpp","win-native/CMakeLists.txt" package/
          @'
          @echo off
          set "ROOT=%~dp0"
          "%ROOT%bin\ironbox.exe" --disk "%ROOT%bin\forgeos.forgefs" %*
          '@ | Set-Content "package/RUN_FORGEOS.bat" -Encoding ASCII
          Compress-Archive -Path package/* -DestinationPath ForgeOS-windows-x86_64.zip -Force

      - name: Upload native Windows release
        uses: actions/upload-artifact@v4
        with:
          name: ForgeOS-windows-x86_64
          path: ForgeOS-windows-x86_64.zip
